spring:
  datasource:
    url: jdbc:h2:mem:banksphere_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
  flyway:
    enabled: false

banksphere:
  jwt:
    secret: TestSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLongForTesting
    expiration-ms: 3600000
    refresh-expiration-ms: 86400000
