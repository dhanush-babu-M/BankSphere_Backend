<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; }
        .container { background-color: #ffffff; padding: 20px; max-width: 600px; margin: auto; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .header { background-color: #0056b3; color: white; padding: 10px 20px; text-align: center; border-radius: 8px 8px 0 0; }
        .content { padding: 20px; text-align: center; }
        .otp { font-size: 24px; font-weight: bold; color: #0056b3; letter-spacing: 2px; }
        .footer { text-align: center; font-size: 12px; color: #777; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>BankSphere Security</h2>
        </div>
        <div class="content">
            <p>Dear <span th:text="${customerName}">Customer</span>,</p>
            <p>Your One-Time Password (OTP) for your recent request is:</p>
            <p class="otp" th:text="${otp}">123456</p>
            <p>This OTP is valid for <span th:text="${expiryMinutes}">5</span> minutes. Please do not share this code with anyone.</p>
        </div>
        <div class="footer">
            <p>&copy; 2026 BankSphere. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
