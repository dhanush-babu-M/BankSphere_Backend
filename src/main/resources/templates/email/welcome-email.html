<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #eef2f5; padding: 20px; }
        .card { background-color: white; border-radius: 10px; padding: 40px; max-width: 600px; margin: auto; }
        .header { color: #004488; text-align: center; margin-bottom: 30px; }
        .welcome-text { font-size: 18px; color: #333; line-height: 1.6; }
        .info-box { border: 1px solid #ddd; padding: 15px; border-radius: 5px; margin: 20px 0; background-color: #fcfcfc; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>Welcome to BankSphere!</h1>
        </div>
        <div class="welcome-text">
            <p>Hi <span th:text="${name}">Customer</span>,</p>
            <p>Thank you for choosing BankSphere. We are thrilled to have you on board.</p>
        </div>
        <div class="info-box">
            <p><strong>Customer ID:</strong> <span th:text="${customerId}">CUST123</span></p>
            <p><strong>Account Number:</strong> <span th:text="${accountNumber}">ACCT123</span></p>
        </div>
        <p>To get started, please log in to your internet banking profile and complete your setup.</p>
        <p>Best Regards,<br>The BankSphere Team</p>
    </div>
</body>
</html>
